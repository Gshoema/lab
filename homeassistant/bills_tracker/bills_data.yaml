##############################################################################
# Bills & Payday data
# Place at: <config>/bills_data.yaml
#
# PAYDAY - choose exactly ONE of these three recurrence types:
#
#   weekly   -> weekday: monday/tuesday/.../sunday (or 0-6, Monday=0)
#   biweekly -> weekday: same as above, PLUS anchor_date: "YYYY-MM-DD"
#               anchor_date must be one real, known payday on that weekday -
#               it's used to figure out which weeks are "on" vs "off" in
#               the every-other-week cycle. Any date that was/will be an
#               actual biweekly payday works, past or future.
#   monthly  -> due_day: 1-31, or "eom" for last business day / end of month
#
# BILLS - each bill can independently use any of these recurrence types
# (payday only needs the three above; bills support the full set since
# things like car insurance, annual subscriptions, and every-other-month
# charges are all common):
#
#   monthly    -> due_day: 1-31, or "eom" for end-of-month
#   bimonthly  -> due_day: 1-31 (or "eom"), PLUS anchor_month: 1-12
#                 Charges every OTHER month. anchor_month is any ONE month
#                 you know it charges - e.g. anchor_month: 1 means it
#                 charges Jan/Mar/May/Jul/Sep/Nov (odd months); anchor_month: 2
#                 would mean Feb/Apr/Jun/Aug/Oct/Dec (even months) instead.
#   yearly     -> due_day: 1-31 (or "eom"), plus due_month: 1-12
#   weekly     -> weekday: monday/tuesday/.../sunday (or 0-6, Monday=0)
#   biweekly   -> weekday + anchor_date, same as payday above
#
# After editing, call service pyscript.update_bills_sensors to refresh
# immediately, or wait for the nightly 00:05 refresh.
##############################################################################

# ---- pick ONE payday option and delete/comment the other two ----

payday:
  recurrence: weekly
  weekday: friday

